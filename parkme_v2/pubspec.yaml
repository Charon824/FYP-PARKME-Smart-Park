name: parkme
description: ParkMe – Smart Parking App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  device_preview: ^1.3.1

  # Firebase
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.2
  firebase_database: ^11.3.5    # Realtime Database (sensor data)
  cloud_firestore: ^5.6.6       # Firestore (user profiles, bookings)

  # Auth providers
  google_sign_in: ^6.2.2

  # UI
  google_fonts: ^6.1.0
  font_awesome_flutter: ^11.0.0
  flutter_svg: ^2.0.10+1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - images/
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Medium.ttf  weight: 500
  #       - asset: assets/fonts/Inter-Bold.ttf    weight: 700
